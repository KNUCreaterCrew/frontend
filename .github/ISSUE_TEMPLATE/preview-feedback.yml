name: 미리보기 의견
description: 모의 데이터 미리보기 사이트에서 본 화면에 대한 의견
title: '[미리보기] '
labels: [preview-feedback]
body:
  - type: input
    id: scenario
    attributes:
      label: 시나리오
  - type: input
    id: page
    attributes:
      label: 화면 주소
  - type: textarea
    id: what
    attributes:
      label: 무엇이 이상했나요
      description: 스크린샷을 끌어다 놓을 수 있어요.
      placeholder: 좌석 번호가 잘 안 보여요
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 어떻게 보이면 좋을까요
  - type: dropdown
    id: device
    attributes:
      label: 기기
      options:
        - iPhone
        - Android
        - 데스크톱
        - 기타
