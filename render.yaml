# Render Blueprint: 대시보드의 New → Blueprint 에서 이 저장소를 고르면 아래 설정으로 정적 사이트를 만든다.
# 배포 순서와 CORS 등록은 README 의 "배포" 절을 본다.
services:
  - type: web
    name: zeroframe-web
    runtime: static
    # Node 버전은 .nvmrc(24)를 따른다. 따르지 않으면 대시보드 Environment 에 NODE_VERSION=24 를 넣는다. (빌드는 2026-11-19 성공, 로그의 Node 버전 표기는 미확인)
    # corepack 으로 packageManager 에 적힌 pnpm 을 맞춘다. (2026-11-19 첫 배포가 이 명령으로 빌드되어 올라감)
    # 백엔드 주소는 빌드 때 .env.production 의 VITE_API_ORIGIN 으로 들어간다. 값이 없으면 빌드가 실패한다.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    # 시연 전날까지 대시보드 Settings 에서 자동 배포를 끄고, 끝나면 다시 켠다. 시연 중 배포가 돌지 않게 하기 위해서다.
    autoDeployTrigger: checksPass
    # PR 미리보기는 출처가 매번 달라 백엔드 CORS 허용 목록에 넣을 수 없어 끈다.
    previews:
      generation: off
    headers:
      # 파일 이름에 해시가 붙어 내용이 바뀌면 이름도 바뀌므로 오래 캐시해도 된다.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # 새로고침이나 QR 로 /rooms/IT4-101 을 바로 열어도 앱이 뜨게 한다.
      # 실제 파일이 있는 경로는 rewrite 보다 먼저 서빙된다. (2026-11-19 curl 로 확인: /assets/*.js 가 application/javascript 로 옴)
      - type: rewrite
        source: /*
        destination: /index.html

  # 모의 데이터 미리보기 사이트. 실제 백엔드를 부르지 않는다(MSW 가 브라우저에서 응답한다).
  # 대시보드 Environment 에 VITE_API_ORIGIN 을 넣으면 config/apiOrigin.ts 가 mock 빌드를 실패시킨다. 넣지 않는다.
  # 미확인: 시연 전 운영 서비스 자동 배포를 끈 상태에서 Blueprint Sync 를 하면 자동 배포가 다시 켜질 수 있다. 시연 기간에는 Sync 하지 않는다.
  - type: web
    name: zeroframe-web-preview
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:mock
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    previews:
      generation: off
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # 워커 파일은 이름에 해시가 없으므로 매번 새로 받아 오래된 워커가 남지 않게 한다.
      - path: /mockServiceWorker.js
        name: Cache-Control
        value: no-cache
      # 미리보기 주소가 검색에 잡히지 않게 한다.
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
